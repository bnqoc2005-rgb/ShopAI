// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath 'com.google.gms:google-services:4.4.2'        // Đọc file google-services.json
    classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2' // Sinh mapping.txt cho Symbolication
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

subprojects {
  afterEvaluate { project ->
    if (project.hasProperty("android")) {
      project.android {
        if (namespace == null) {
          namespace project.group ?: "expo.modules"
        }
        buildFeatures {
          buildConfig = true
        }
        if (project.plugins.hasPlugin("com.android.library")) {
          publishing {
            singleVariant("release")
          }
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
